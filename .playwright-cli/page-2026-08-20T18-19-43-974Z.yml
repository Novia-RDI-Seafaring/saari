                - strong [ref=e198]: Title/abstract screening only.
                - text: Unless full texts were separately retrieved and recorded, screening relied on titles and abstracts.
              - listitem [ref=e199]:
                - strong [ref=e200]: No formal risk-of-bias / quality appraisal
                - text: was applied to included studies unless recorded separately.
              - listitem [ref=e201]:
                - strong [ref=e202]: No prospective registration.
                - text: This protocol was not registered on PROSPERO or OSF.
