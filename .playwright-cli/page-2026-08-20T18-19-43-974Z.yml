| 30 | | 8 | snowball | `both:openalex:W2165744313` | 2026-08-13 | 50 | | 9 | openalex | `embeddings vector database` | 2026-08-13 | 25 | | 10 | openalex | `LLM agents for systematic literature review screening` | 2026-08-13 | 25 | ### 2.3 Selection process Of 255 unique records, 122 were screened to a decision (43 included, 57 excluded, 22 maybe); 133 remain unscreened. ### 2.4 Synthesis method <!-- WRITE: Describe the synthesis approach (narrative / thematic) --> _[Describe the synthesis approach (narrative / thematic) — to be written.]_ ### 2.5 Limitations of this review This review was produced with saari and carries the following method limitations, which readers should weigh: - **Single bibliographic source.** Records were identified via the OpenAlex API (plus citation snowballing), not multiple databases (e.g. Scopus, Web of Science, IEEE Xplore). Coverage is bounded by OpenAlex indexing and English-language metadata. - **Single-reviewer screening.** Inclusion/exclusion decisions were made by a single reviewer (human or LLM agent). There was no second independent reviewer and no inter-rater agreement statistic (e.g. Cohen's κ). - **Title/abstract screening only.** Unless full texts were separately retrieved and recorded, screening relied on titles and abstracts. - **No formal risk-of-bias / quality appraisal** was applied to included studies unless recorded separately. - **No prospective registration.** This protocol was not registered on PROSPERO or OSF. ## 3. Results ### 3.1 Study selection ![PRISMA flow diagram](prisma.svg) <!-- WRITE: Narrate the selection process (refer to the PRISMA diagram above) --> _[Narrate the selection process (refer to the PRISMA diagram above) — to be written.]_ ### 3.2 Corpus landscape ![Corpus landscape — 2D projection of the embedded corpus](landscape.svg) ### 3.3 Study characteristics | Cite key | Authors | Year | Venue | Citations | OA | DOI | |---|---|---|---|---|---|---| | `brown1983the` | Brown et al. | 1983 | Cognition 