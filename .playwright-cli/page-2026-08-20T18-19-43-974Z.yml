            - paragraph [ref=e191]: "This review was produced with saari and carries the following method limitations, which readers should weigh:"
            - list [ref=e192]:
              - listitem [ref=e193]:
                - strong [ref=e194]: Single bibliographic source.
                - text: Records were identified via the OpenAlex API (plus citation snowballing), not multiple databases (e.g. Scopus, Web of Science, IEEE Xplore). Coverage is bounded by OpenAlex indexing and English-language metadata.
              - listitem [ref=e195]:
                - strong [ref=e196]: Single-reviewer screening.
                - text: Inclusion/exclusion decisions were made by a single reviewer (human or LLM agent). There was no second independent reviewer and no inter-rater agreement statistic (e.g. Cohen's κ).
