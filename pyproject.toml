[project]
name = "saari"
version = "0.0.1"
description = "Agent-driven literature review toolkit (saaristo project)"
readme = { text = "See DESIGN.md.", content-type = "text/markdown" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "typer>=0.12",
    "mcp>=1.2",
    "fastembed>=0.8.0",
    "sqlite-vec>=0.1.9",
    "umap-learn>=0.5.12",
]

[project.scripts]
saari = "saari.cli:app"
saari-mcp = "saari.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saari"]
